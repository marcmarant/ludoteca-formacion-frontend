<div class="container">
    <h1>Catálogo de juegos</h1>

    <div class="filters">
        <form>
            <mat-form-field>
                <mat-label>Título del juego</mat-label>
                <input
                    type="text"
                    matInput
                    placeholder="Título del juego"
                    [(ngModel)]="filterTitle"
                    name="title"
                    (blur)="onSearch()"
                    (keydown.enter)="onSearch()"
                />
            </mat-form-field>

            <mat-form-field>
                <mat-label>Autor del juego</mat-label>
                <input
                    type="text"
                    matInput
                    placeholder="Autor del juego"
                    [(ngModel)]="filterAuthor"
                    name="author"
                    (blur)="onSearch()"
                    (keydown.enter)="onSearch()"
                />
            </mat-form-field>

            <mat-form-field>
                <mat-label>Categoría del juego</mat-label>
                <mat-select disableRipple [(ngModel)]="filterCategory" name="category" (selectionChange)="onSearch()">
                    @for (category of categories; track category.id) {
                        <mat-option [value]="category">{{ category.name }}</mat-option>
                    }
                </mat-select>
            </mat-form-field>
        </form>

        <div class="buttons">
            <button mat-stroked-button (click)="onCleanFilter()">Limpiar filtros</button>
        </div>
    </div>

    <div class="game-list">
        @for (game of games(); track game.id) {
            <app-game-item
                [game]="game"
                (click)="editGame(game)"
            />
        }
    </div>

    <div class="bottom-buttons">
        @if (this.authService.isAuthenticated()) {
            <button mat-flat-button color="primary" (click)="createGame()">
                Nuevo juego
            </button>
        }
    </div>
</div>
